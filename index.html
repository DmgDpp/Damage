<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Barang Damage</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h2>Laporan Barang Damage</h2>
    
    <form id="damageForm">
      
      <div class="row">
        <div class="col form-group">
          <label for="project">Nama Project</label>
          <input type="text" id="project" placeholder="Contoh: Project Nike" required>
        </div>
        
        <div class="col form-group">
          <label for="noBa">No. Berita Acara (BA)</label>
          <input type="text" id="noBa" placeholder="Contoh: BA-2026-001" required>
        </div>
      </div>

      <div class="row">
        <div class="col form-group">
          <label for="tipeDamage">Tipe Damage</label>
          <select id="tipeDamage" required>
            <option value="">-- Pilih Tipe --</option>
            <option value="Inbound">Inbound</option>
            <option value="Handling">Handling</option>
          </select>
        </div>

        <div class="col form-group">
          <label for="qty">Jumlah (Qty)</label>
          <input type="number" id="qty" min="1" placeholder="1" required>
        </div>
      </div>

      <div class="form-group">
        <label for="sku">SKU / Nama Barang</label>
        <input type="text" id="sku" placeholder="Contoh: SKU-8802 - Sepatu Running" required>
      </div>

      <div class="form-group">
        <label for="keterangan">Keterangan / Kronologi Kerusakan</label>
        <textarea id="keterangan" placeholder="Jelaskan detail kerusakan barang..." required></textarea>
      </div>

      <div class="form-group">
        <label for="pdfFile">Upload PDF Berita Acara</label>
        <input type="file" id="pdfFile" accept="application/pdf" required>
      </div>

      <div class="form-group">
        <label for="photoFiles">Upload Foto Kerusakan (Bisa >1 foto)</label>
        <input type="file" id="photoFiles" accept="image/*" multiple required>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">Kirim Laporan</button>
    </form>

    <div id="loading">⏳ Sedang mengunggah data ke Google Drive & Sheets...</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
