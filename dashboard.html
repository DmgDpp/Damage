<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Barang Damage</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>

  <header class="header">
    <h1>Dashboard Barang Damage</h1>
    <div class="header-actions">
      <input type="text" id="searchInput" placeholder="Cari Project, SKU, atau No BA...">
      <select id="filterTipe">
        <option value="">Semua Tipe Damage</option>
        <option value="Inbound">Inbound</option>
        <option value="Handling">Handling</option>
      </select>
      <a href="index.html" class="btn-add">+ Input Laporan Baru</a>
    </div>
  </header>

  <main class="container">
    <div id="loading" class="loading">⏳ Memuat data dari Google Sheets...</div>
    <div id="cardGrid" class="card-grid"></div>
  </main>

  <script src="dashboard.js"></script>
</body>
</html>
